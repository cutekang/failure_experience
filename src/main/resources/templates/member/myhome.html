<!doctype html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>개인 페이지</title>
</head>
<body>

    <button onclick="window.location.href='/member/update'">회원정보 수정</button>
    <button onclick="window.location.href='/member/withdraw'">회원 탈퇴</button>

    <th:block th:object="${member}">
    <div>
        <p th:text="'번호 : ' + *{id}"></p>
        <p th:text="'이메일 : ' + *{memberEmail}"></p>
        <p th:text="'비밀번호 : ' + *{memberPassword}"></p>
        <p th:text="'이름 : ' + *{memberName}"></p>
        <p th:text="'주소 : ' + *{memberAddress}"></p>
        <p th:text="'전화번호 : ' + *{memberPhone}"></p>
    </div>
    </th:block>
</body>
